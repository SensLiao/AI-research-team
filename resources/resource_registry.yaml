# Shared Resource Pool — metadata + secret REFERENCES only (NEVER values).
#
# Every `secret_ref` / `endpoint_ref` / `*_ref` value is the NAME of a gitignored
# research_agent_teams/.env variable (CLAUDE.md §6). This file holds NO credential. A value is
# resolved only at connect time by the execute/connect layer — never by the resource plane, never
# echoed to chat / logs / artifacts. The loader (tools/resources.py) REJECTS any *_ref that is not a
# bare UPPER_SNAKE env-var name, so a real secret pasted here fails loudly instead of leaking.
schema_version: 1
resources:
  # --- hardware ---------------------------------------------------------------------------------
  - resource_id: server.honor.gpu
    type: hardware.ssh_server
    display_name: "Honor-degree GPU server (2x RTX A6000, Ubuntu, tmux scheduler)"
    scope: shared
    owner: director
    auth: password                       # matches reality (no pubkey today)
    endpoint_ref: RAT_SERVER_HOST
    connect_host_ref: RAT_SERVER_CONNECT_HOST
    port_ref: RAT_SERVER_PORT
    remote_workdir_ref: RAT_REMOTE_WORKDIR
    secret_refs:
      host: RAT_SERVER_HOST
      user: RAT_SERVER_USER
      password: RAT_SERVER_PASSWORD
    capabilities: [query_status, pull_logs, submit_job]   # submit_job = live execute (gated)
    default_policy: least_privilege
    hardware_inventory:
      verified_at: "2026-07-31T11:08:12Z"
      gpu_count: 2
      gpus:
        - {index: 0, model: "NVIDIA RTX A6000", memory_mib: 49140}
        - {index: 1, model: "NVIDIA RTX A6000", memory_mib: 49140}
      driver_version: "530.41.03"
    intended_use: >-
      Primary PET/CT training, held-out inference, evaluation and downstream Route A execution after
      each experiment's frozen gate and explicit live-submit authorization.
    execution_ready: true
    execution_status: gated_available
    status: available

  - resource_id: server.usyd.bdav_z390_3090
    type: hardware.ssh_server
    display_name: "USyd BDAV Z390 mixed-GPU server (RTX 3090 + GTX 1080 Ti; read-only verified)"
    scope: shared
    owner: director
    auth: password
    endpoint_ref: RAT_BDAV_Z390_HOST
    port_ref: RAT_BDAV_Z390_PORT
    remote_workdir_ref: RAT_BDAV_Z390_REMOTE_WORKDIR
    python_ref: RAT_BDAV_Z390_REMOTE_PYTHON
    conda_env_ref: RAT_BDAV_Z390_REMOTE_CONDA_ENV
    conda_sh_ref: RAT_BDAV_Z390_REMOTE_CONDA_SH
    scheduler_ref: RAT_BDAV_Z390_SCHEDULER
    results_pull_dir_ref: RAT_BDAV_Z390_RESULTS_PULL_DIR
    known_hosts_ref: RAT_BDAV_Z390_KNOWN_HOSTS
    connect_host_ref: RAT_BDAV_Z390_CONNECT_HOST
    ssh_key_ref: RAT_BDAV_Z390_SSH_KEY
    secret_refs:
      host: RAT_BDAV_Z390_HOST
      user: RAT_BDAV_Z390_USER
      password: RAT_BDAV_Z390_PASSWORD
    capabilities: [query_status, pull_logs, submit_job]
    default_policy: least_privilege
    hardware_inventory:
      verified_at: "2026-07-31T11:08:48Z"
      gpu_count: 2
      gpus:
        - {index: 0, model: "NVIDIA GeForce RTX 3090", memory_mib: 24576}
        - {index: 1, model: "NVIDIA GeForce GTX 1080 Ti", memory_mib: 11264}
      driver_version: "535.230.02"
      reported_cuda_version: "12.2"
    intended_use: >-
      Secondary or overflow PET/CT execution resource after a fresh live execution-admission check;
      authenticated read-only status and log queries remain independently available when authorized.
    execution_ready: false
    execution_status: director_reported_resolved_live_reverification_pending
    execution_blockers:
      - live_execution_admission_not_reverified
    note: >-
      Strict-pinned authenticated read-only inventory passed on 2026-07-31. The director reported on
      2026-08-01 that the prior 3090-server problem was resolved, but this T4 task intentionally made no
      live query. Historical disk/environment/scheduler blockers therefore cannot be carried forward as
      current facts, and execution readiness also cannot be asserted. Keep submit_job default-denied until
      a fresh live preflight verifies identity, GPU/process ownership, storage, environment, scheduler,
      receipts/gates and duplicate-job risk.
    status: director_reported_resolved_reverification_pending

  # --- research APIs ----------------------------------------------------------------------------
  - resource_id: api.semantic_scholar
    type: api_key
    display_name: "Semantic Scholar Academic Graph API"
    scope: shared
    secret_refs: {api_key: RAT_S2_API_KEY}
    capabilities: [paper_search, citation_existence]
    budget: {monthly_limit_usd: null}
    status: available
  - resource_id: api.openalex_crossref
    type: polite_pool
    display_name: "OpenAlex / Crossref (OpenAlex API key plus contact identity)"
    scope: shared
    secret_refs: {contact_mail: RAT_CONTACT_MAIL, openalex_api_key: RAT_OPENALEX_API_KEY}
    capabilities: [paper_search, citation_existence]
    status: available
  - resource_id: api.ollama_local
    type: local_service
    display_name: "Local Ollama (decorrelated mock-review seat)"
    scope: shared
    endpoint_ref: RAT_OLLAMA_URL
    secret_refs: {model: RAT_OPENREVIEWER_MODEL}
    capabilities: [mock_review]
    status: available

  # --- harness web tools (provided by Claud Code; no project-held secret) -----------------------
  - resource_id: tool.exa
    type: harness_connector
    display_name: "Exa web search + fetch (Claude Code MCP)"
    scope: shared
    capabilities: [web_search, web_fetch]
    note: "provided by the Claude Code harness; no project-held secret"
    status: available
  - resource_id: tool.websearch
    type: harness_connector
    display_name: "Harness WebSearch"
    scope: shared
    capabilities: [web_search]
    note: "provided by the Claude Code harness; no project-held secret"
    status: available
  - resource_id: tool.context7
    type: harness_connector
    display_name: "Context7 library-docs lookup (MCP)"
    scope: shared
    capabilities: [docs_lookup]
    note: "provided by the Claude Code harness; no project-held secret"
    status: available

  # --- personal connectors (scope: personal — explicit per-project binding + approval) -----------
  - resource_id: connector.notion
    type: harness_connector
    display_name: "Notion (MCP, personal)"
    scope: personal
    capabilities: [notion_read, notion_write]
    status: available
  - resource_id: connector.gmail
    type: harness_connector
    display_name: "Gmail (MCP, personal)"
    scope: personal
    capabilities: [mail_read, mail_draft]
    status: available
  - resource_id: connector.gdrive
    type: harness_connector
    display_name: "Google Drive (MCP, personal)"
    scope: personal
    capabilities: [drive_read]
    status: available
  - resource_id: connector.vercel
    type: harness_connector
    display_name: "Vercel (MCP, personal)"
    scope: personal
    capabilities: [deploy_read]
    status: available
