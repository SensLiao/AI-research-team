recovery_and_first_inventory_plan:
  state: COMPLETED_THROUGH_INV1_READ_ONLY_VERIFIED_EXECUTION_BLOCKED
  hard_invariants:
    - no_credential_value_in_repo_logs_or_evidence
    - strict_pinned_canonical_identity_required_for_read_only_verified_state
    - external_identity_confirmation_not_claimed_without_out_of_band_evidence
    - canonical_hostname_remains_the_ssh_host_key_identity
    - tcp_reachability_is_not_authentication_or_gpu_readiness
    - first_inventory_is_read_only
    - submit_job_remains_default_denied
  steps:
    - id: CR-1
      status: COMPLETE
      owner: university_admin_and_director
      action: >-
        Reset or reissue the lost rotated credential and transfer it through the director's private,
        out-of-repository handoff channel.
      completion_evidence: >-
        Record only that the private handoff exists; never record, print, hash, or copy the credential value.
    - id: TRUST-1
      status: COMPLETE_STRICT_PIN_ACTIVE_EXTERNAL_CONFIRMATION_NOT_RECORDED
      owner: university_admin_or_existing_trusted_user
      action: >-
        Independently confirm the canonical hostname and at least one expected SSH host-key fingerprint.
      completion_evidence: >-
        Only the key algorithm, SHA256 fingerprint, confirmer role, and confirmation date may enter evidence.
    - id: LOCAL-1
      status: COMPLETE
      owner: director_authorized_local_operator
      prerequisites: [CR-1, TRUST-1]
      action: >-
        Populate the existing gitignored environment references and a strict known_hosts entry keyed by the
        canonical hostname. Do not add credential values or machine-specific trust files to the repository.
      completion_evidence: >-
        Boolean presence and permission checks only; do not emit environment values or private paths.
    - id: INV-1
      status: PASS_READ_ONLY
      owner: director_authorized_local_operator
      prerequisites: [LOCAL-1, explicit_live_query_authorization]
      action: >-
        Open one strict-pinned-key authenticated read-only session and collect the minimum inventory: hostname,
        UTC time, OS/kernel, user/group identity, GPU count/model/memory/driver/CUDA report, /mnt/HDD4 free space,
        workdir existence/readability, and Python/Conda command availability.
      prohibited_actions:
        - package_installation
        - file_creation_or_write_probe
        - job_submission
        - training_or_inference
      completion_evidence: >-
        Redacted command receipts and inventory facts bound to the independently confirmed fingerprint; writable
        workdir status remains unverified until a separately authorized write probe.
    - id: POST-1
      status: COMPLETE_READ_ONLY_VERIFIED_SUBMIT_DENIED
      owner: resource_governance
      prerequisites: [INV-1]
      pass_transition: >-
        Set only read_only_verified and retain query_status/pull_logs; submit_job stays default-denied.
      fail_transition: >-
        Retain configured_unverified and credential_recovery_required; do not retry with alternate identities,
        host keys, run roots, or credentials.

