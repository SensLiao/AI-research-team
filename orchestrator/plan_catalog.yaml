# Research-plan catalog — the SINGLE SOURCE OF TRUTH for the orchestrator's "combine modes into
# tiers" behavior (director lock 2026-06-19: a request must be able to invoke a COMBINATION of modes,
# not one mode at a time).
#
# Flow this drives (see research-orchestrator SKILL.md §1):
#   1. A director request maps to an INTENT (match_intents, by alias).
#   2. Each intent offers TIERS — core / mainline / full (more allowed) — where a tier is an ORDERED
#      CHAIN of one-button modes. The director picks ONE tier via AskUserQuestion (recommendation +
#      cost shown).
#   3. Then the director answers each chosen mode's drill-down questions — ONE round per mode (a
#      3-mode tier => 3 rounds), from `mode_questions` below.
#   4. The chain runs link-by-link: each link is a normal `operate begin --mode <m>` run, threaded
#      with `--upstream-run <prev>` so link N reads link N-1's output, and PAUSING at the human gates
#      a chain passes through (`mode_gates`).
#
# Honesty contract (enforced by tools/research_plan.py + tests/test_research_plan.py):
#   - Only WIRED (operated:true in mode_registry.yaml) modes belong in a default tier. validate_chain
#     REJECTS an unknown mode and FLAGS a spec-only one (never pretends a spec-only mode is one-button).
#   - estimate_cost reads mode_registry.yaml budgets; tiers are ALWAYS core <= mainline <= full by
#     agent-hops (a test enforces monotonicity).
#   - The chain never self-decides: the model proposes; the director picks the tier AND every human gate.
#   - This file is DATA. Edit a tier here and the menu changes with ZERO code change.

version: 1

# ----------------------------------------------------------------------------------------------------
# Per-mode drill-down questions — the rounds asked AFTER a tier is picked (one round per mode in the
# chosen chain). `maps_to` tells the orchestrator how to translate the answer onto the existing
# `operate begin` surface (see SKILL.md §1.6):
#   pre_search  -> run `operate pre-search` for that link (live) or skip it (vault-only)
#   budget      -> the link's depth knob (folded into the request/north-star + model policy)
#   north_star  -> sharpen the link's --north-star / --in-scope / --out-of-scope (or fold a value in)
#   note        -> an honesty acknowledgement (no flag; e.g. GPU-still-gated)
# A mode not listed here has no knob beyond the shared pre-search default.
mode_questions:
  manuscript_reconstruction:
    - key: pre_search
      ask: "有 unverifiable-here / 补证据车道时,先联网核对相关文献吗?(更实,稍慢)"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: "live"}
        - {label: "只用库", value: "vault-only"}

  gap_breadth:
    - key: pre_search
      ask: "扫空白前先联网拉一遍真实文献吗?(更全,稍慢)"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  deep_research:
    - key: depth
      ask: "文献深读到什么程度?"
      maps_to: budget
      options:
        - {label: "快 · 约 8 篇精读", value: quick}
        - {label: "标准 · 约 20 篇 · 推荐", value: standard}
        - {label: "穷尽 · 拉满预算", value: exhaustive}
    - key: pre_search
      ask: "先联网拉真实文献?"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  evidence_review:
    - key: pre_search
      ask: "先联网拉真实文献再评?"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  evidence_deep:
    - key: pre_search
      ask: "先联网拉真实文献再深评(找矛盾/失效点)?"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  new_direction:
    - key: scope
      ask: "找方向要收紧范围吗?(给一句更窄的北极星 / 排除某些方向)"
      maps_to: north_star
      options:
        - {label: "全域扫 · 不收紧", value: broad}
        - {label: "我给一句更窄的方向", value: narrow}
    - key: pre_search
      ask: "先联网查真实文献来给点子接地?"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  deep_ideation:
    - key: scope
      ask: "深度+跨域找方向,要收紧范围吗?"
      maps_to: north_star
      options:
        - {label: "全域 · 不收紧", value: broad}
        - {label: "我给一句更窄的方向", value: narrow}
    - key: pre_search
      ask: "先联网查真实文献?(deep_ideation 强烈建议联网)"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  full_rigor_minimal:
    - key: design_target
      ask: "为哪个想法设计验证实验?"
      maps_to: north_star
      options:
        - {label: "我在 /idea-bet 下注的那个", value: bet}
        - {label: "我现在指定一个", value: specify}
    - key: gpu_note
      ask: "现在只产出实验设计 + 脚本 + 预注册(GPU 真跑要服务器),确认?"
      maps_to: note
      options:
        - {label: "确认 · 先出设计与脚本", value: scripts-only}
  venue_readiness:
    - key: venue_tier
      ask: "目标投稿层级?"
      maps_to: north_star
      options:
        - {label: "顶会 (CVPR/NeurIPS/ICML…)", value: tier1}
        - {label: "专科会议/期刊 (如医学影像)", value: tier2}
        - {label: "期刊", value: tier3}
  ingest_paper:
    - key: paper_ref
      ask: "读哪一篇?(给标题/DOI/arXiv 号,或说'已经放进 01-raw 了')"
      maps_to: north_star
      options:
        - {label: "文件已放进 01-raw/", value: in-raw}
        - {label: "我给标题或链接", value: specify}
    - key: pre_search
      ask: "顺带联网核一下这篇的出处和被引情况?"
      maps_to: pre_search
      options:
        - {label: "联网核对 · 推荐", value: live}
        - {label: "只用手上的文件", value: vault-only}
  read_paper_deep:
    - key: paper_ref
      ask: "深读哪一篇?(给标题/DOI/arXiv 号,或说'已经放进 01-raw 了')"
      maps_to: north_star
      options:
        - {label: "文件已放进 01-raw/", value: in-raw}
        - {label: "我给标题或链接", value: specify}
    - key: read_focus
      ask: "这次深读最想要什么?(会影响 20 个 agent 的重心,不会砍掉任何一个 agent)"
      maps_to: north_star
      options:
        - {label: "全面拆解 · 推荐", value: full}
        - {label: "重点看方法能不能搬到我们项目", value: transfer}
        - {label: "重点看结果和统计站不站得住", value: results}
  manuscript_authoring:
    - key: draft_scope
      ask: "这次写到哪一步?"
      maps_to: north_star
      options:
        - {label: "全稿初稿", value: full-draft}
        - {label: "只写某几节(方法/实验/讨论)", value: sections}
    - key: evidence_note
      ask: "只用已冻结、有回执的结果写(没有结果的地方留空并标出),确认?"
      maps_to: note
      options:
        - {label: "确认 · 不许编数字", value: frozen-only}
  manuscript_review:
    - key: review_target
      ask: "审哪一份稿?"
      maps_to: north_star
      options:
        - {label: "上一步刚写出来的那份", value: upstream}
        - {label: "我现在指定一份", value: specify}
    - key: independence_note
      ask: "审稿人不会看到写稿过程(防自评),因此它可能提出写稿方已经想过的问题,确认?"
      maps_to: note
      options:
        - {label: "确认 · 要的就是独立视角", value: blind}

  # ---- wave 2 (2026-08-04) -----------------------------------------------------------------------
  # One drill-down round per new one-button mode. Each knob maps onto a flag that already exists —
  # no new operate surface — and every `note` row is an honesty acknowledgement the director ticks
  # BEFORE the run, not a disclaimer they discover in the report.
  gap_scan:
    - key: pre_search
      ask: "扫空白前先联网拉一遍真实文献吗?(更全,稍慢)"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
  full_new_direction:
    - key: scope
      ask: "方向调研要收紧范围吗?(给一句更窄的北极星)"
      maps_to: north_star
      options:
        - {label: "全域 · 不收紧", value: broad}
        - {label: "我给一句更窄的方向", value: narrow}
    - key: handoff_note
      ask: "这条路刻意停在下注之前——押哪个方向仍然只能你按 /idea-bet,确认?"
      maps_to: note
      options:
        - {label: "确认 · 只要论纲,不要它替我选", value: stops-before-bet}
  design_experiment:
    - key: design_target
      ask: "为哪个想法设计实验?"
      maps_to: north_star
      options:
        - {label: "我在 /idea-bet 下注的那个", value: bet}
        - {label: "我现在指定一个", value: specify}
    - key: plan_only_note
      ask: "这条路只出设计,不冻结预注册也不跑任何东西,确认?"
      maps_to: note
      options:
        - {label: "确认 · 只要设计", value: design-only}
  power_analysis_review:
    - key: decision_question
      ask: "你要用这个实验回答的那个决定是什么?(功效分析要围着它算)"
      maps_to: north_star
      options:
        - {label: "沿用上一步设计里的 RQ", value: upstream}
        - {label: "我现在说清楚", value: specify}
    - key: options_note
      ask: "它不会给「够/不够」的二元结论,而是给若干设计改法和各自代价,确认?"
      maps_to: note
      options:
        - {label: "确认 · 我要选项不要判决", value: decision-options}
  m2_accept:
    - key: design_target
      ask: "验收哪一份实验设计?"
      maps_to: north_star
      options:
        - {label: "上一步刚冻结的那份", value: upstream}
        - {label: "我现在指定一份", value: specify}
    - key: gpu_note
      ask: "没有真实执行回执时,指标一律留空、运行记录停在「只做了计划」,确认?"
      maps_to: note
      options:
        - {label: "确认 · 不许编数字", value: receipt-or-empty}
  analysis_audit_panel:
    - key: audit_target
      ask: "审哪一批结果?"
      maps_to: north_star
      options:
        - {label: "上一步跑出来的那批", value: upstream}
        - {label: "我现在指定", value: specify}
    - key: disagreement_note
      ask: "诊断 agent 判断打架时,分歧会原样呈现给你而不是挑一个赢家,确认?"
      maps_to: note
      options:
        - {label: "确认 · 我要看到分歧", value: show-disagreement}
  verify_result:
    - key: review_target
      ask: "审哪一个结果?"
      maps_to: north_star
      options:
        - {label: "上一步审计过的那批", value: upstream}
        - {label: "我现在指定", value: specify}
    - key: independence_note
      ask: "审稿 agent 互不通气,因此可能重复提出彼此想过的问题,确认?"
      maps_to: note
      options:
        - {label: "确认 · 要的就是独立视角", value: blind}
  check_run:
    - key: run_target
      ask: "看哪一次运行?"
      maps_to: north_star
      options:
        - {label: "最近那一次", value: latest}
        - {label: "我给 run-id", value: specify}
    - key: readonly_note
      ask: "全程只读——干预菜单是选项,一次都不会替你执行,确认?"
      maps_to: note
      options:
        - {label: "确认 · 只看不动", value: read-only}
  repo_code_audit:
    - key: audit_scope
      ask: "审哪个范围?"
      maps_to: north_star
      options:
        - {label: "整个仓库", value: repo}
        - {label: "我指定的目录/文件", value: paths}
    - key: patch_authorization
      ask: "默认只审不改。要现在就授权它动代码吗?"
      maps_to: note
      options:
        - {label: "只审不改 · 推荐", value: audit-only}
        - {label: "授权改动(仍会逐项留痕)", value: authorized-patch}

  # ---- wave-2 backlog closed (2026-08-07) ----------------------------------------------------
  # The last two modes whose modules were written but left unregistered pending tests.
  ideate_ring:
    - key: opportunity_set
      ask: "这场淘汰赛的输入机会点是什么?(直接说清楚,ring 没有上游 DISCOVER 产物,读的就是你这句话)"
      maps_to: north_star
      options:
        - {label: "我现在说清楚机会点/观察", value: specify}
        - {label: "沿用当前北极星的范围描述", value: upstream}
    - key: no_self_bet_note
      ask: "五个 agent 各自独立(假设→淘汰赛→进化→可行性+查重),但机器不下注,最后你按 /idea-bet 选,确认?"
      maps_to: note
      options:
        - {label: "确认 · 我要菜单不要它替我选", value: no-self-bet}
  aers_enhanced_research_pack:
    - key: pre_search
      ask: "配材料包前先联网拉一遍真实文献吗?(更全,稍慢)"
      maps_to: pre_search
      options:
        - {label: "联网 · 推荐", value: live}
        - {label: "只用库", value: vault-only}
    - key: execute_boundary_note
      ask: "EXECUTE 环节只做打包与审计,不会假装任何实验真的跑过,own_measured_metrics 结构上强制为空,确认?"
      maps_to: note
      options:
        - {label: "确认 · 只要材料包,不要编数字", value: packaging-only}

# ----------------------------------------------------------------------------------------------------
# Which human gate(s) a mode routes THROUGH. When a chain reaches such a mode it PAUSES there; the
# director decides; the model never self-decides. Rendered as "this tier will stop for your sign-off
# at …" on the tier card.
mode_gates:
  new_direction: ["/idea-bet"]
  deep_ideation: ["/idea-bet"]
  venue_readiness: ["/venue-pick", "/venue-decide"]

# ----------------------------------------------------------------------------------------------------
# Phase rank — a valid chain is NON-DECREASING in rank (discovery -> ideate -> design -> venue).
# research_plan.validate_chain flags a STRICTLY-decreasing step (e.g. venue before ideate) as a
# violation. Within a rank the order is free (e.g. scan a gap before OR after deep-reading evidence).
phase_rank:
  ingest_paper: 1       # discovery / read a single source
  read_paper_deep: 1
  gap_breadth: 1        # discovery / scan
  deep_research: 1      # discovery / evidence
  evidence_review: 1
  evidence_deep: 1
  new_direction: 2      # ideate (find a direction)
  deep_ideation: 2
  full_rigor_minimal: 3 # design / execute
  venue_readiness: 4    # venue / publish
  manuscript_authoring: 4
  manuscript_review: 4
  manuscript_reconstruction: 4
  # ---- wave 2 (2026-08-04) -------------------------------------------------------------------
  # Same four phases. Rank 3 covers design → execute → analyze → verify as ONE band on purpose:
  # within a rank the order is free, and forcing an order between "design the experiment",
  # "watch the run" and "audit the result" would reject legitimate chains (audit → redesign →
  # re-audit) that a researcher really does run.
  gap_scan: 1           # discovery / lightweight gap map
  full_new_direction: 1 # discovery / direction brief that stops before the bet
  repo_code_audit: 1    # discovery / a repo can be audited at any point
  ideate_ring: 2        # ideate (tournament -> /idea-bet)
  design_experiment: 3
  design_experiment_minimal: 3
  power_analysis_review: 3
  m2_accept: 3
  check_run: 3
  debug_failed_run: 3
  tree_explore: 3
  analysis_audit_panel: 3
  verify_result: 3
  aers_enhanced_research_pack: 4  # submission engineering

# ----------------------------------------------------------------------------------------------------
# Intents — the research arcs a director request maps onto. Each tier's `modes` is an ordered chain of
# WIRED modes; exactly one tier per intent carries `recommended: true`.
intents:
  find_direction:
    aliases: ["找方向", "找个方向", "找研究方向", "找一个方向", "find a direction", "research direction",
              "new direction", "想个课题", "下一步做什么", "帮我找方向"]
    # keywords: shorter high-signal tokens matched as substrings (robust to natural phrasing where a
    # full alias is broken up, e.g. 找/个/研究/方向). alias + keyword hits are summed; ties keep order.
    keywords: ["方向", "课题", "direction", "research topic", "topic"]
    description: "从零找一个值得下注的研究方向。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [new_direction]
        why: "直接对你关心的领域做接地 + 查重 + 可行性打分,出一张可下注的方向卡。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [gap_breadth, new_direction]
        why: "先并行扫一遍空白点,再深度产点子——方向更有把握。"
      - id: full
        label: "全面 · 最深最广"
        modes: [gap_breadth, deep_research, deep_ideation]
        why: "扫空白 → 深读证据 → 跨域深度产点子,把深度和广度都拉满。"

  validate_idea:
    aliases: ["验证想法", "我有个想法", "验证一下", "验证这个想法", "validate", "validate idea",
              "check this idea", "这个想法行不行", "评估我的点子", "我有个点子"]
    keywords: ["想法", "点子", "验证", "idea", "validate"]
    description: "你已经有一个候选想法,想把它压力测试到能不能做、值不值得做。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [new_direction]
        why: "把你的想法接地 + 查重(有没有人做过)+ 可行性打分,出一张可下注卡。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [deep_research, new_direction, full_rigor_minimal]
        why: "先把证据查扎实 → 深度产点子并查重 →(下注后)给一份可执行的验证实验设计。"
      - id: full
        label: "全面 · 最深最广"
        modes: [deep_research, deep_ideation, full_rigor_minimal, venue_readiness]
        why: "深证据 → 跨域深度产点子 → 实验设计 → 投稿就绪度,一条龙。"

  assess_evidence:
    aliases: ["评证据", "评一下证据", "文献深读", "证据怎么样", "assess evidence", "evidence review",
              "literature review", "这些证据靠谱吗", "证据评估"]
    keywords: ["证据", "文献", "evidence", "literature", "citation"]
    description: "评估某个主张/方向的证据强度与文献支持。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [evidence_review]
        why: "把证据查清、查引用真伪,出一张证据画像。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [deep_research, evidence_deep]
        why: "先深读文献 → 再做深度证据评估(找矛盾、找失效点)。"
      - id: full
        label: "全面 · 最深最广"
        modes: [deep_research, evidence_deep, gap_breadth]
        why: "深读 → 深评 → 顺带扫出还剩哪些空白点。"

  scan_gaps:
    aliases: ["扫空白", "扫一遍空白点", "有哪些空白", "gap scan", "white space", "哪里还没人做",
              "空白点", "找空白"]
    keywords: ["空白", "白点", "gap", "white space", "还没人做"]
    description: "在一个领域里并行扫描尚未被做的空白点。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [gap_scan]
        why: "两个互相独立的搜索 agent 各自出候选 → 独立分类去重 → 每条空白都带出处。不谈新颖性、不推荐押哪个。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [gap_breadth, deep_research]
        why: "扫空白 → 对最有戏的空白深读文献坐实。"
      - id: full
        label: "全面 · 最深最广"
        modes: [gap_breadth, deep_research, deep_ideation]
        why: "扫空白 → 深证据 → 跨域深度产点子(直到 /idea-bet)。"

  # 2026-08-01: added because four one-button modes had NO intent at all — a director asking to read a
  # paper, design an experiment, or write/review a manuscript fell through to the direction-finding arc.
  # A capability with no route is a capability the director cannot reach.
  read_paper:
    aliases: ["读论文", "读这篇论文", "精读", "精读论文", "深读这篇", "拆解方法", "收论文", "收论文进库",
              "论文入库", "read this paper", "read paper", "deep read", "paper reading", "ingest paper",
              "这篇论文讲了什么", "帮我看这篇论文"]
    keywords: ["论文", "paper", "精读", "深读", "拆解", "入库", "ingest"]
    description: "把一篇具体论文读进来:从一页论文卡,到逐条主张/方法/图表/数值的深读。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [ingest_paper]
        why: "一页论文卡:来源、要点、主张、方法数据指标、跟我们项目的关系、下一步读什么。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [read_paper_deep]
        why: "20 个 agent 深读:核心主张 + 证据在第几页 + 方法拆解 + 结果复核 + 图表数学复现材料 + 审稿人会攻击的点。"
      - id: full
        label: "全面 · 最深最广"
        modes: [read_paper_deep, evidence_deep]
        why: "深读这一篇 → 再把它放回文献里做深度证据评估(它跟别人矛盾吗、结论还站得住吗)。"

  design_experiment:
    aliases: ["设计实验", "怎么做实验", "实验怎么设计", "设计这个实验", "design experiment",
              "experiment design", "实验方案", "做个实验计划", "预注册"]
    keywords: ["实验", "experiment", "设计方案", "预注册", "protocol", "消融", "ablation"]
    description: "把一个想法变成可执行、可证伪、统计上站得住的实验方案(含预注册与可运行脚本)。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [full_rigor_minimal]
        why: "研究问题 → 变量与对照 → 数据划分 → 指标与统计 → 预注册冻结 → 可运行脚本 + 止损条件。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [evidence_deep, full_rigor_minimal]
        why: "先把相关证据和已有基线查扎实,再设计实验——避免设计出一个别人已经回答过的实验。"
      - id: full
        label: "全面 · 最深最广"
        modes: [deep_research, evidence_deep, full_rigor_minimal]
        why: "深读文献 → 深度证据评估 → 实验设计,把基线公平性和统计严谨度都拉满。"

  write_review_article:
    aliases: ["写综述", "写一篇综述", "综述文章", "方法学批判综述", "methodological critical review",
              "critical review article", "write a review article", "draft a survey paper"]
    keywords: ["综述", "critical review", "review article", "survey paper"]
    negative_keywords: ["control plane", "orchestrator", "skill", "mode", "router", "workflow implementation", "测试", "test"]
    description: "先形成可复核的综述语料和方法边界，再直接写 LaTeX，并由独立稿件评审检查最终 PDF。"
    tiers:
      - id: core
        label: "核心 · 已有冻结语料"
        modes: [manuscript_authoring, manuscript_review]
        why: "只在已有全文语料、ontology、SOURCES/EVIDENCE ledger 已冻结时使用。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [evidence_deep, manuscript_authoring, manuscript_review]
        why: "证据与检索边界 → LaTeX 成稿 → 最终稿独立盲审；最关键的论文再定向深读，不全量启动 20 个 agent。"
      - id: full
        label: "全面 · 加投稿体检"
        modes: [evidence_deep, manuscript_authoring, manuscript_review, venue_readiness]
        why: "在主线之后核对目标期刊规则；不会把 critical review 伪装成 systematic/scoping review。"

  write_manuscript:
    aliases: ["写稿", "写论文", "帮我写稿", "起草论文", "写初稿", "审稿", "审一遍我的稿",
              "独立审稿", "帮我审稿", "manuscript", "write the paper", "draft the paper",
              "review my manuscript", "peer review"]
    keywords: ["写稿", "初稿", "稿件", "审稿", "manuscript", "draft"]
    negative_keywords: ["control plane", "orchestrator", "skill", "mode", "router", "workflow implementation", "测试", "test"]
    description: "把已经成立的结果写成稿件,并用独立盲审挑毛病(写与审分开跑,防自评)。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [manuscript_review]
        why: "只审不写:对你已有的稿子做一份独立审稿报告(主张、统计、图表、引用)。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [manuscript_authoring, manuscript_review]
        why: "先写稿,再由一个完全独立、不看写稿过程的评审去挑毛病——作者不能给自己打分。"
      - id: full
        label: "全面 · 最深最广"
        modes: [manuscript_authoring, manuscript_review, venue_readiness]
        why: "写稿 → 独立审稿 → 投稿就绪度(模拟盲审 + 目标会议匹配),一路到 /venue-pick。"

  respond_to_review:
    aliases: ["返修", "回应审稿意见", "回复审稿", "回复审稿意见", "审稿意见来了", "rebuttal",
              "revise and resubmit", "respond to the review", "respond to reviewers"]
    keywords: ["返修", "审稿意见", "rebuttal", "revise", "reviewer"]
    description: "外部审稿意见到了:逐条核验审稿人说的对不对,给出修复分工计划;修与复审各自独立成跑。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [manuscript_reconstruction]
        why: "把真实审稿意见拆成逐条已核验的修复车道(改哪、谁改、哪些要你拍板),不动稿子。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [manuscript_reconstruction, manuscript_authoring, manuscript_review]
        why: "旧意见逐条核验 → 直接修 LaTeX → 对最终 source/PDF 做新一轮盲审；两道门一次跑完。"
      - id: full
        label: "全面 · 最深最广"
        modes: [manuscript_reconstruction, manuscript_authoring, manuscript_review, venue_readiness]
        why: "核验 → 修复 → 完全独立盲审 → 投稿体检；每一步都绑定最终稿，不复用旧 review。"

  prep_submission:
    aliases: ["够投顶会吗", "够投吗", "投稿就绪", "能投吗", "venue", "venue readiness", "submission ready",
              "投稿准备", "评审会怎么看", "够发表吗"]
    keywords: ["投稿", "顶会", "发表", "venue", "submission", "审稿", "能投"]
    description: "评估一个结果是否达到目标会议/期刊的发表门槛。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [venue_readiness]
        why: "模拟盲审 3 个 reviewer 给一个就绪度判断 → /venue-pick · /venue-decide。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [full_rigor_minimal, venue_readiness]
        why: "先把实验设计/统计补严(脚本 + 预注册)→ 再做投稿就绪度。"
      - id: full
        label: "全面 · 最深最广"
        modes: [evidence_deep, full_rigor_minimal, venue_readiness]
        why: "深证据复核 → 实验严谨化 → 投稿就绪度,降低被拒风险。"

  # 2026-08-04 (wave 2): four arcs that had no route at all, because the modes serving them were
  # registry-defined but not one-button. Same rule as the 2026-08-01 round that added read_paper /
  # design_experiment / write_manuscript: a capability with no intent is a capability the director
  # cannot ask for in their own words, so wiring a mode without routing it changes nothing for them.
  audit_result:
    aliases: ["这批结果站得住吗", "审一下结果", "结果可信吗", "audit the result", "结果复核",
              "帮我挑结果的毛病", "这个结论能不能下"]
    keywords: ["结果", "可信", "复核", "audit", "站得住"]
    description: "对已经跑出来的结果做独立审计 —— 基线、方差、公平性、图表、主张强度。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [analysis_audit_panel]
        why: "诊断 agent 各自独立跑,分歧原样呈现给你,不挑赢家。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [analysis_audit_panel, verify_result]
        why: "先审分析本身,再由一组互不通气的审稿人给出「支持什么 / 仍不能声称什么」。"
      - id: full
        label: "全面 · 最深最广"
        modes: [m2_accept, analysis_audit_panel, verify_result]
        why: "冻结设计与执行证据 → 审分析 → 独立判决。没有真实回执时指标一律留空。"

  watch_run:
    aliases: ["实验跑得怎么样", "看一下运行状态", "现在跑到哪了", "run status", "check the run",
              "任务还活着吗", "卡住了吗"]
    keywords: ["跑", "运行状态", "卡住", "status", "monitor"]
    description: "看一次正在跑的运行:状态、告警、以及可选的干预菜单(不替你动手)。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [check_run]
        why: "观察 agent 只报观察到的,独立分诊 agent 才给可能原因和干预选项。全程只读。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [check_run, analysis_audit_panel]
        why: "先看运行健康,再对已产出的中间结果做一次分析审计。"
      - id: full
        label: "全面 · 最深最广"
        modes: [check_run, analysis_audit_panel, verify_result]
        why: "运行状态 → 分析审计 → 独立判决,一次把「跑成什么样」问到底。"

  audit_code:
    aliases: ["审一遍代码", "代码仓审计", "review the repo", "代码有没有问题", "code audit",
              "control plane", "orchestrator skill", "改进 skill", "workflow implementation audit",
              "帮我看看这个仓库"]
    keywords: ["代码", "仓库", "repo", "code audit"]
    description: "对一个代码仓做发现级审计;改代码要另外授权,默认只审不改。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [repo_code_audit]
        why: "只审不改:出发现 + 补丁计划。发现 / 提议 / 真改了的,报告里分三栏,绝不混。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [repo_code_audit, check_run]
        why: "审代码 → 再看它跑起来的实际状态。"
      - id: full
        label: "全面 · 最深最广"
        modes: [repo_code_audit, check_run, analysis_audit_panel]
        why: "审代码 → 看运行 → 审它产出的分析,一条链把工程和结论都查一遍。"

  design_only:
    aliases: ["先出个实验设计", "只要设计不用跑", "实验方案", "experiment design",
              "这个设计够不够", "样本量够吗", "power analysis"]
    keywords: ["设计", "方案", "样本量", "power", "design"]
    description: "只要一份可交付的实验设计(以及它到底能不能回答那个问题),先不跑。"
    tiers:
      - id: core
        label: "核心 · 最快最省"
        modes: [design_experiment]
        why: "RQ → 变量与对照 → 数据协议 → 基线公平,外加三个独立审计审同一份冻结设计。"
      - id: mainline
        label: "主线 · 推荐"
        recommended: true
        modes: [design_experiment, power_analysis_review]
        why: "出设计,再独立追问它有没有足够把握回答那个问题,并给出可选的设计改法。"
      - id: full
        label: "全面 · 最深最广"
        modes: [full_new_direction, design_experiment, power_analysis_review]
        why: "先把方向和已有证据摸清 → 出设计 → 功效复核,避免设计一个别人已经回答过的实验。"

  # 2026-08-07: wave-2 backlog closed. ideate_ring and aers_enhanced_research_pack are each a
  # single standalone mode with no upstream artifact contract (`handoff.accepts: []` — see the
  # registry) — chaining another mode in FRONT of either would promise a link the mode cannot
  # actually consume, so each gets its own single-tier intent rather than being squeezed into an
  # existing multi-tier arc (find_direction's/prep_submission's tiers are all more expensive than
  # ideate_ring's 4-hop budget, and inserting it there would either break tier cost-monotonicity
  # or misrepresent "core = cheapest").
  compete_ideas:
    aliases: ["跑一遍点子锦标赛", "把这些想法排个名次", "淘汰赛式产点子", "idea tournament",
              "ideate ring", "帮我把这几个机会点比一比", "这些想法哪个更好", "机会点排名",
              "给这些观察排个名"]
    keywords: ["锦标赛", "排名", "tournament", "机会点", "比一比", "淘汰赛"]
    description: "手上已经有一组机会点/观察(不是从零找方向),想让它们互相比出高下、进化、查重,产出一张下注菜单。"
    tiers:
      - id: core
        label: "核心 · 唯一档"
        recommended: true
        modes: [ideate_ring]
        why: "假设生成 → 真实成对淘汰赛(不是打分平均)→ 挑强者进化(带血缘,岛模型不收敛到前二)→ 独立可行性打分与查重,五个 agent 各自独立,最后给一张不自我下注的菜单。"

  assemble_reference_pack:
    aliases: ["投稿材料包", "整理复现材料", "帮我配一套投稿参考包", "aers", "reference pack",
              "复现性审计", "文献检索策略", "整理参考文献和复现材料", "配一份材料包"]
    keywords: ["复现", "参考包", "投稿材料", "reproducibility", "bibliography", "aers"]
    description: "组一份引用为准的 AERS 增强研究材料包:检索策略、数据协议审计、复现性审计、基准证据、投稿清单、参考文献核验、稿件润色建议。"
    tiers:
      - id: core
        label: "核心 · 唯一档"
        recommended: true
        modes: [aers_enhanced_research_pack]
        why: "八个 agent 分工:AERS 参考包适用性 + 文献检索策略 → 数据协议审计(反泄漏硬门)→ 复现材料与基准证据独立审计 → 投稿清单与独立参考文献核验 → 稿件润色建议。EXECUTE 环节只打包审计,从不假装真跑过。"
