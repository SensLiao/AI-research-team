# Known agent roster (the complete-form names). graph.yaml allowed_agents and mode_registry
# agent_subset must be subsets of this. Building an agent = writing its spec under agents/;
# listing it here only declares the name is known to the FSM. Status tiers live in the blueprint.
agents:
  control:
    - research-orchestrator
    - state-tracker
    - artifact-contract-enforcer
    - permission-scope-guard
    - budget-and-stop-controller
    - conflict-resolver
  discover:
    - lit-scout
    - model-dataset-scout
    - evidence-verifier
    - repo-code-verifier
    - literature-ingest
    - source-quality-ranker
    - claim-extractor
    - claim-evidence-linker
    - contradiction-miner
    - dataset-card-builder
    - staleness-auditor
    - citation-integrity-auditor
    - landscape-mapper
    - monitor
    - evidence-saturation-judge   # RAT-2: measured DISCOVER search-saturation verdict (informs gate, never decides)
    # paper-reading upgrade (2026-06-26): per-paper deep-read producers (operate sub-workers; rostered, intentionally NOT in any graph allowed_agents / mode agent_subset — same pattern as novelty-collision-checker; the deep-read operate recipe dispatches them)
    - paper-appraiser             # produces paper_appraisal (ADVISORY outward 7-D appraisal of a read paper; never a verdict / gate)
    - method-teardown-extractor   # produces method_teardown (Pass-2 method decomposition of a read paper)
    - figure-reader               # produces figure_reading (Pass-2 structured figure reading)
    - paper-relations-mapper      # produces paper_relations (Stage-4 typed paper<->paper edges)
    - trend-card-builder          # produces trend_card (Stage-4 concept-centric trend extraction)
  gap_hunting:
    - future-work-miner
    - weakness-spotter
    - white-space-mapper
    - cross-domain-transfer-scout
    - contrarian-angle-generator
    - gap-classifier
    - novelty-scorer
  ideate:
    - hypothesis-generator
    - idea-tournament-ranker
    - idea-evolver
    - feasibility-reranker
    - mathematical-formalizer     # RAT-2: typed mechanism abstraction + formal_form (reuses abstract_problem)
    - analogy-mapper              # RAT-2: source↔target mechanism mapping (consumes transfer_candidates)
    - novelty-collision-checker   # novelty-collision gate worker (director lock 2026-06-18): independent IDEATE sub-worker that prior-art-checks every idea before /idea-bet. Rostered so its spec is wellformed; intentionally NOT in any mode agent_subset / graph allowed_agents (it is an operate sub-worker, not an FSM-routed agent — keeps router guardrails minimal).
  design:
    - rq-architect
    - experiment-planner
    - protocol-compiler
    - dataset-split-planner
    - data-protocol-designer
    - config-unifier
    - method-integration-planner
    - baseline-fairness-planner
    - variable-control-auditor
    - train-test-alignment-auditor
    - metric-implementation-auditor
    - statistics-power-auditor
    - decision-surfacer
  execute:
    - patch-planner
    - code-implementer
    - unit-test-writer
    - trainset-builder
    - testset-builder
    - preflight-checker
    - ablation-runner
    - experiment-journaler
    - train-test-parity-verifier
    - sandbox-runner
    - failure-triager
    - repro-runner
    - auto-debugger
    - experiment-tree-explorer
    - variable-touch-guard
  analyze:
    - result-analyzer
    - result-sanity-checker
    - baseline-comparison-auditor
    - variance-analyzer
    - fairness-auditor
    - compliance-auditor
    - goal-alignment-checker
    - failure-case-miner
    - figure-generator
    - visualization-auditor
    - claim-strength-calibrator
    - figure-vlm-critic
    - integrity-refusal-recommender   # RAT-2: ADVISORY-only unsupported-number/integrity flagger (never a gate; decision stays the director's)
  verify:
    - review-configurator
    - methodology-reviewer
    - domain-reviewer
    - adversarial-reviewer
    - scientific-critic
    - review-synthesizer
    - synthesis-writer
    - contribution-ledger-builder
    - threats-to-validity-writer
    - review-response-simulator
    - venue-review-configurator
    - venue-selector
    - venue-reviewer-persona
    - area-chair-synthesizer
    - quality-controller          # RAT-2: cross-stage scorecard aggregator (reads existing verdicts; can_finish derived, never overrides human gates)
    # absorption wave 1 — ScholarPeer panel roles
    - baseline-scout
    - sub-domain-historian
