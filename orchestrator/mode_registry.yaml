    # Research delivery itself is record-only: deterministic scientific gates
    # still run inside DISCOVER, but producing a brief is not a director choice.
    # Human sign-off belongs to /idea-bet, /venue-* and /promote-to-vault.
    gate_level: record_only
    # Budget caps lifted 2026-08-20 by explicit director instruction ("预算不要控死…如果 paper 需要阅读的
    # 多的话，不要控制做，要的是质量，而不是控制数量"). null = unbounded (tools/budget_tracker.py).
    # A 124-source corpus against max_fulltext_reads: 20 was the structural cause of treating "retrieved"
    # as "read" (D-04). The CONVERGENCE guard is deliberately kept: iterations_without_new_evidence still
    # stops sprawl that adds no evidence, which bounds waste without bounding depth.
    budget: {max_agent_hops: null, max_supplement_agent_hops: 200, max_iterations_without_new_evidence: 3, max_fulltext_reads: null, max_debug_retries_per_run: 3}
    # max_supplement_agent_hops stays an integer because schemas/task_frame.schema.json types it
    # `integer` (only max_agent_hops and max_fulltext_reads accept null). Raised 16 -> 200 rather
    # than widening the schema: a contract change needs the director, a generous bound does not.
    handoff:
      contract_version: mode-handoff/v2
      product_version: research-brief/v2
      primary_markdown: director-review/research/research-brief.md
      # The delivery boundary is the reusable truth surface. Content convergence alone is never
      # evidence/citation/novelty clearance, and downstream modes must not infer that it is.
      reusable_artifacts: [evidence-table.artifact.json, source-quality-report.artifact.json, claim-list.artifact.json, claim-evidence-map.artifact.json, contradiction-report.artifact.json, research-brief.artifact.json, research-dossier-method-review.artifact.json, research-dossier-implementation-review.artifact.json, research-dossier-evidence-review.artifact.json, research-convergence-verdict.artifact.json, research-delivery-boundary.artifact.json, research-markdown-brief.artifact.json]
      accepts: [ingest-paper/v1, paper-reading/v2, paper-reading/v3, evidence-brief/v2, evidence-deep/v2]
  # --- M3-d (VR-1 venue-targeted peer-review) — VERIFY-entry, reuses the M2 panel + venue agents ---
  venue_readiness:
    entry_stage: VERIFY
    operated: true   # wired in operate/modes/__init__.py::REGISTRY (audit B1/B3; wiring test enforces the mirror)
    stage_path: [VERIFY, REPORT]
    agent_subset: [venue-selector, venue-review-configurator, venue-reviewer-persona,
                   venue-reviewer-methodology, venue-reviewer-domain,
                   venue-reviewer-adversarial, area-chair-synthesizer,
                   adversarial-reviewer, scientific-critic, baseline-scout, sub-domain-historian]
    gate_level: director_signoff     # "is this good enough for venue X" — the VERIFY hard gate (adversarial-reviewer) fires (router guardrail 1); reviewers never self-decide (venue_review has no verdict field) and never write (no Write tool); the area-chair verdict is DERIVED by venue_score.py; venue choice (/venue-pick) and publish (/venue-decide) are human gates.
    budget: {max_agent_hops: 6}
    handoff:
      contract_version: mode-handoff/v2
      product_version: venue-readiness/v2
      primary_markdown: director-review/venue/venue-readiness.md
      reusable_artifacts: [venue-readiness-verdict.artifact.json, venue-meta-review.artifact.json]
      accepts: [full-rigor/v2, manuscript-review/v1]
