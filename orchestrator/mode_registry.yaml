            produces: "Data-handling audit and reproducibility package specification."
          - id: audit_benchmarks_and_submission
            workers: [benchmark-evidence-auditor, submission-guideline-scout, bibliography-validator]
            produces: "Benchmark evidence matrix, venue checklist, and bibliography findings."
          - id: polish_manuscript
            workers: [manuscript-polish-editor]
            produces: "Traceable manuscript edit recommendations without changing scientific claims silently."
          - id: render_markdown
            workers: [synthesis-writer]
            produces: "Integrated research pack with reference provenance and no execution claim."
      productization_gaps:
        - "Add an operated recipe with reference resolution and explicit per-stage artifact contracts."
        - "Define EXECUTE as packaging or audit work unless a separate real execution journal is present."
        - "Add deterministic pack coverage, bibliography, Markdown rendering, and mode-level end-to-end tests."
    gate_level: record_only
    budget: {max_agent_hops: 12}
  # Actual deep_research operated recipe.
  deep_research:
    entry_stage: DISCOVER
    operated: true   # wired in operate/modes/__init__.py::REGISTRY (audit B1/B3; wiring test enforces the mirror)
    stage_path: [DISCOVER, REPORT]   # true perspective panel -> claim/evidence/contradiction synthesis -> Markdown research brief
    agent_subset: [lit-scout, source-quality-ranker, evidence-search-moderator,
                   model-dataset-scout, future-work-miner,
                   cross-domain-transfer-scout, weakness-spotter, claim-extractor,
                   claim-evidence-linker, citation-coverage-auditor, contradiction-miner, landscape-mapper,
                   evidence-verifier, citation-integrity-auditor]
    gate_level: director_signoff     # both DISCOVER hard gates fire (router guardrail 1); the brief feeds bets/designs downstream
    budget: {max_agent_hops: 12, max_iterations_without_new_evidence: 3, max_fulltext_reads: 20, max_debug_retries_per_run: 3}
    handoff:
      contract_version: mode-handoff/v2
      product_version: research-brief/v2
      primary_markdown: director-review/research/research-brief.md
      reusable_artifacts: [evidence-table.artifact.json, source-quality-report.artifact.json, claim-list.artifact.json, claim-evidence-map.artifact.json, contradiction-report.artifact.json, landscape-map.artifact.json]
      accepts: [ingest-paper/v1, paper-reading/v2, paper-reading/v3, evidence-brief/v2, evidence-deep/v2]
  # --- M3-d (VR-1 venue-targeted peer-review) — VERIFY-entry, reuses the M2 panel + venue agents ---
  venue_readiness:
    entry_stage: VERIFY
    operated: true   # wired in operate/modes/__init__.py::REGISTRY (audit B1/B3; wiring test enforces the mirror)
    stage_path: [VERIFY, REPORT]
    agent_subset: [venue-selector, venue-review-configurator, venue-reviewer-persona,
                   venue-reviewer-methodology, venue-reviewer-domain,
                   venue-reviewer-adversarial, area-chair-synthesizer,
                   adversarial-reviewer, scientific-critic, baseline-scout, sub-domain-historian]
    gate_level: director_signoff     # "is this good enough for venue X" — the VERIFY hard gate (adversarial-reviewer) fires (router guardrail 1); reviewers never self-decide (venue_review has no verdict field) and never write (no Write tool); the area-chair verdict is DERIVED by venue_score.py; venue choice (/venue-pick) and publish (/venue-decide) are human gates.
    budget: {max_agent_hops: 6}
    handoff:
      contract_version: mode-handoff/v2
      product_version: venue-readiness/v2
      primary_markdown: director-review/venue/venue-readiness.md
      reusable_artifacts: [venue-readiness-verdict.artifact.json, venue-meta-review.artifact.json]
      accepts: [full-rigor/v2]
